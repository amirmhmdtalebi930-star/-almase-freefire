<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الماس فری فایر | خرید الماس</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #080b16;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #11162a;
      padding: 18px 15px;
      text-align: center;
      border-bottom: 1px solid #242b47;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      color: #ffd43b;
      font-size: 24px;
    }

    header p {
      color: #aeb6d0;
      margin-top: 7px;
      font-size: 13px;
    }

    .hero {
      text-align: center;
      padding: 35px 15px 25px;
    }

    .hero h2 {
      font-size: 28px;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .hero h2 span {
      color: #ffd43b;
    }

    .hero p {
      color: #aeb6d0;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    .box {
      background: #11162a;
      border: 1px solid #242b47;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .box-title {
      font-size: 18px;
      margin-bottom: 15px;
      color: #ffd43b;
    }

    .packages {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .package {
      background: #171d34;
      border: 2px solid transparent;
      border-radius: 15px;
      padding: 18px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .package:hover {
      border-color: #ffd43b;
      transform: translateY(-2px);
    }

    .package.selected {
      border-color: #ffd43b;
      background: #202743;
    }

    .diamond {
      font-size: 20px;
      color: #4dc8ff;
      font-weight: bold;
    }

    .price {
      margin-top: 10px;
      color: #ffd43b;
      font-size: 16px;
      font-weight: bold;
    }

    .input {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 1px solid #303957;
      border-radius: 12px;
      background: #080b16;
      color: white;
      outline: none;
      font-size: 15px;
      text-align: center;
    }

    .input:focus {
      border-color: #ffd43b;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 15px;
      margin-top: 15px;
      background: #ffd43b;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #ffdf63;
    }

    .result {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: #18243a;
      border: 1px solid #304568;
      line-height: 2;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .feature {
      background: #11162a;
      border: 1px solid #242b47;
      border-radius: 14px;
      padding: 15px 8px;
      text-align: center;
      font-size: 12px;
      color: #c5cbe0;
    }

    .feature strong {
      display: block;
      color: #ffd43b;
      font-size: 18px;
      margin-bottom: 7px;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      color: #777f99;
      font-size: 12px;
    }

    @media (max-width: 450px) {
      .packages {
        grid-template-columns: 1fr 1fr;
      }

      .features {
        grid-template-columns: 1fr;
      }

      .hero h2 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>💎 الماس فری فایر</h1>
  <p>فروش الماس فری فایر</p>
</header>

<section class="hero">
  <h2>خرید <span>الماس فری فایر</span></h2>
  <p>بسته موردنظر خود را انتخاب کنید</p>
</section>

<div class="container">

  <div class="box">
    <div class="box-title">💎 انتخاب بسته</div>

    <div class="packages" id="packages"></div>
  </div>

  <div class="box">
    <div class="box-title">🎮 اطلاعات بازیکن</div>

    <label>Player ID</label>
    <input
      id="playerId"
      class="input"
      type="text"
      placeholder="آیدی فری فایر خود را وارد کنید"
    >

    <button class="btn" onclick="createOrder()">
      ادامه و ثبت سفارش
    </button>

    <div id="result" class="result"></div>
  </div>

  <div class="features">
    <div class="feature">
      <strong>💎</strong>
      بسته‌های مختلف
    </div>

    <div class="feature">
      <strong>⚡</strong>
      ثبت سفارش سریع
    </div>

    <div class="feature">
      <strong>🔒</strong>
      ثبت اطلاعات سفارش
    </div>
  </div>

</div>

<footer>
  © 2026 الماس فری فایر
</footer>


<script>

/*
====================================
       💰 قیمت‌های سایت
====================================

اگر بعداً خواستی قیمت‌ها را تغییر بدهی،
فقط عدد price را تغییر بده.

مثلاً:
price: 90000

یعنی ۹۰ هزار تومان
*/

const packages = [
  {
    diamonds: 100,
    price: 80000
  },
  {
    diamonds: 310,
    price: 120000
  },
  {
    diamonds: 520,
    price: 250000
  },
  {
    diamonds: 1060,
    price: 400000
  },
  {
    diamonds: 2180,
    price: 600000
  },
  {
    diamonds: 5600,
    price: 950000
  }
];

let selectedPackage = null;


/*
====================================
       نمایش بسته‌ها
====================================
*/

const packagesBox = document.getElementById("packages");

packages.forEach((item, index) => {

  const div = document.createElement("div");

  div.className = "package";

  div.innerHTML = `
    <div class="diamond">
      💎 ${item.diamonds.toLocaleString("fa-IR")} الماس
    </div>

    <div class="price">
      ${item.price.toLocaleString("fa-IR")} تومان
    </div>
  `;

  div.onclick = function () {

    document.querySelectorAll(".package")
      .forEach(x => x.classList.remove("selected"));

    div.classList.add("selected");

    selectedPackage = item;
  };

  packagesBox.appendChild(div);
});


/*
====================================
       ثبت سفارش
====================================
*/

function createOrder() {

  const playerId =
    document.getElementById("playerId").value.trim();

  const result =
    document.getElementById("result");


  if (!selectedPackage) {

    result.style.display = "block";

    result.innerHTML =
      "⚠️ لطفاً ابتدا یک بسته الماس انتخاب کنید.";

    return;
  }


  if (!playerId) {

    result.style.display = "block";

    result.innerHTML =
      "⚠️ لطفاً Player ID خود را وارد کنید.";

    return;
  }


  const orderId =
    "FF" +
    Date.now().toString().slice(-8);


  const order = {

    orderId: orderId,

    playerId: playerId,

    diamonds: selectedPackage.diamonds,

    price: selectedPackage.price,

    date: new Date().toLocaleString("fa-IR")

  };


  localStorage.setItem(
    "ff_order_" + orderId,
    JSON.stringify(order)
  );


  result.style.display = "block";

  result.innerHTML = `
    <b>✅ سفارش با موفقیت ثبت شد</b>
    <br>
    شماره سفارش:
    <b>${orderId}</b>
    <br>
    الماس:
    ${selectedPackage.diamonds.toLocaleString("fa-IR")}
    <br>
    مبلغ:
    ${selectedPackage.price.toLocaleString("fa-IR")} تومان
    <br><br>

    <small>
    این نسخه فعلاً ثبت سفارش را انجام می‌دهد.
    در مرحله بعد می‌توانیم پرداخت آنلاین را به آن وصل کنیم.
    </small>
  `;

}

</script>

</body>
  </html>
