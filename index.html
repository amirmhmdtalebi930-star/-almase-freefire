<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الماس فری فایر</title><style>body{margin:0;background:#07111f;color:#fff;font-family:Arial}main{max-width:520px;margin:auto;padding:18px}.card{background:#0d2035;border:1px solid #24577e;border-radius:18px;padding:16px;margin:12px 0}button,input,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px}button{border:0;background:#159ff0;color:#fff;font-weight:bold}input,select{background:#071827;color:#fff;border:1px solid #315b78}.price{font-weight:bold;color:#7ed7ff}.small{color:#9eb4c7;font-size:13px}.order{border-top:1px solid #23445d;padding:12px 0}</style><main><h1>💎 الماس فری فایر</h1><div class="card"><h2>خرید جم</h2><select id="pack"><option value="100">100 جم</option><option value="310">310 جم</option><option value="520">520 جم</option><option value="1060">1060 جم</option></select><p>قیمت: <b id="price">قیمت تنظیم نشده</b></p><input id="pid" placeholder="Player ID"><button onclick="buy()">ثبت سفارش</button></div><div class="card"><h2>📋 خریدهای من</h2><div id="orders"></div></div><div class="card"><h2>🛠️ مدیریت قیمت</h2><input id="p100" placeholder="قیمت 100 جم"><input id="p310" placeholder="قیمت 310 جم"><input id="p520" placeholder="قیمت 520 جم"><input id="p1060" placeholder="قیمت 1060 جم"><button onclick="savePrices()">ذخیره قیمت‌ها</button></div><div class="card"><h2>💳 پرداخت آزمایشی</h2><p class="small">این بخش فقط برای تست است و هیچ پول واقعی دریافت نمی‌کند.</p><div id="paybox"></div></div></main><script>const packs=[100,310,520,1060],pack=document.getElementById('pack');const defaultPrices={100:'60 هزار تومان',310:'150 هزار تومان',520:'250 هزار تومان',1060:'400 هزار تومان'};function price(n){return localStorage.getItem('p'+n)||defaultPrices[n]||''}function refresh(){let v=price(pack.value);document.getElementById('price').textContent=v||'قیمت تنظیم نشده'}pack.onchange=refresh;packs.forEach(n=>{let v=price(n);if(v)document.getElementById('p'+n).value=v});refresh();function savePrices(){packs.forEach(n=>localStorage.setItem('p'+n,document.getElementById('p'+n).value.trim()));refresh();alert('قیمت‌ها ذخیره شد ✅')}function buy(){let pid=document.getElementById('pid').value.trim(),n=pack.value,pr=price(n),msg=document.getElementById('paybox');if(!pid){msg.innerHTML='<p class=small>⚠️ لطفاً Player ID را وارد کن.</p>';return}if(!pr){msg.innerHTML='<p class=small>⚠️ اول قیمت این بسته را تنظیم کن.</p>';return}let a=JSON.parse(localStorage.getItem('orders')||'[]');let order={number:'FF'+Date.now(),pack:n+' جم',playerId:pid,price:pr,status:'در انتظار پرداخت'};a.unshift(order);localStorage.setItem('orders',JSON.stringify(a));document.getElementById('pid').value='';render();msg.innerHTML='<p>✅ سفارش با موفقیت ثبت شد.</p><p class=small>شماره سفارش: '+order.number+'<br>مبلغ: '+order.price+'</p>';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});} 
function render(){let a=JSON.parse(localStorage.getItem('orders')||'[]'),b=document.getElementById('orders');b.innerHTML=a.length?a.map((o,i)=>`<div class="order"><b>💎 ${o.pack}</b><p>Player ID: ${o.playerId}</p><p>مبلغ: ${o.price}</p><p>وضعیت: ${o.status}</p><button onclick="testPay(${i})">${o.status==='پرداخت‌شده'?'پرداخت‌شده':'💳 پرداخت آزمایشی'}</button></div>`).join(''):'<p class="small">هنوز سفارشی ثبت نشده است.</p>'}function testPay(i){let a=JSON.parse(localStorage.getItem('orders')||'[]');if(a[i].status==='پرداخت‌شده')return; if(!confirm('پرداخت آزمایشی این سفارش با مبلغ '+a[i].price+' انجام شود؟'))return; a[i].status='پرداخت‌شده';localStorage.setItem('orders',JSON.stringify(a));render();alert('پرداخت آزمایشی موفق بود ✅')} render();</script>
